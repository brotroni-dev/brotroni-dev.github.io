<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roni Brot-Kolinkó - Product Designer</title>
<meta name="description" content="Roni Brot-Kolinkó - a product designer, curious person, and someone who cares a lot about how things feel.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/tokens.css?v=34">
<style>
  /* ============================================================
     Homepage - warm parchment cover. Fixed lines, so hovering a
     token only reflows its own line (no whole-paragraph jump).
     Hover via JS mouseenter/leave; the pill only grows, so it
     never flickers. Image hides, label expands inline.
     ============================================================ */
  * { box-sizing: border-box; }
  :root { --parchment: #F1EADD; --pill-fill: color-mix(in srgb, var(--accent) 20%, #FFFFFF);
    --ease: cubic-bezier(.62, 0, .34, 1); }
  body {
    margin: 0; min-height: 100vh; background: var(--parchment); color: var(--text);
    font-family: var(--font-body); font-size: 15px; line-height: 1.6;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    display: flex; flex-direction: column; position: relative; overflow-x: hidden;
  }
  a { color: inherit; }
  img { display: block; max-width: 100%; }

  /* --- Random hand-drawn shapes, kept to the margins; slow organic drift --- */
  .bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .shape { position: absolute; display: block; will-change: transform; }
  .shape svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .fill-t { background: radial-gradient(closest-side, color-mix(in srgb, var(--accent) 18%, transparent), transparent 70%); }
  .fill-o { background: radial-gradient(closest-side, color-mix(in srgb, var(--ochre) 22%, transparent), transparent 70%); }
  .s1 { width: 520px; height: 470px; top: -170px; right: -150px; border-radius: 47% 53% 55% 45% / 52% 47% 53% 48%; animation: m5 64s ease-in-out infinite; }
  .s2 { width: 470px; height: 430px; bottom: -180px; left: -160px; border-radius: 54% 46% 48% 52% / 46% 54% 46% 54%; animation: m4 72s ease-in-out infinite; }
  .s3 { width: 108px; height: 108px; left: 6%; top: 12%; opacity: .5; animation: m1 58s ease-in-out infinite; }
  .s4 { width: 172px; height: 164px; right: 7%; top: 9%; opacity: .5; animation: m2 54s ease-in-out infinite; }
  .s5 { width: 220px; height: 84px; left: 13%; bottom: 11%; opacity: .45; animation: m3 46s ease-in-out infinite; }
  .s6 { width: 90px; height: 112px; right: 13%; bottom: 13%; opacity: .5; animation: m4 50s ease-in-out infinite -12s; }
  .s7 { width: 138px; height: 128px; left: 25%; top: 7%; opacity: .42; animation: m1 66s ease-in-out infinite -22s; }
  .s8 { width: 76px; height: 76px; right: 27%; top: 15%; opacity: .5; animation: m2 44s ease-in-out infinite -8s; }
  @keyframes m1 { 0% { transform: translate(0,0) rotate(0); } 33% { transform: translate(-20px,16px) rotate(70deg); } 66% { transform: translate(12px,26px) rotate(150deg); } 100% { transform: translate(0,0) rotate(360deg); } }
  @keyframes m2 { 0% { transform: translate(0,0) rotate(0); } 50% { transform: translate(22px,-20px) rotate(-120deg); } 100% { transform: translate(0,0) rotate(-360deg); } }
  @keyframes m3 { 0% { transform: translate(0,0) rotate(0); } 40% { transform: translate(-16px,-10px) rotate(6deg); } 70% { transform: translate(10px,-20px) rotate(-6deg); } 100% { transform: translate(0,0) rotate(0); } }
  @keyframes m4 { 0% { transform: translate(0,0) rotate(0); } 50% { transform: translate(20px,16px) rotate(140deg); } 100% { transform: translate(0,0) rotate(300deg); } }
  @keyframes m5 { 0% { transform: translate(0,0); } 33% { transform: translate(-18px,14px); } 66% { transform: translate(14px,20px); } 100% { transform: translate(0,0); } }
  @media (prefers-reduced-motion: reduce) { .shape { animation: none !important; } }

  .top, .hero, .foot { position: relative; z-index: 1; }

  /* --- Top bar --- */
  .top { display: flex; justify-content: space-between; align-items: baseline;
    padding: var(--s5) clamp(20px, 5vw, 56px); }
  .top__name { font-family: var(--font-display); font-weight: 500; font-size: 18px; color: var(--title); text-decoration: none; }
  .top__links a { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted); text-decoration: none; margin-left: var(--s5); }
  .top__links a:hover { color: var(--accent); }

  /* --- Hero (centered, fixed lines) --- */
  .hero { flex: 1; display: flex; align-items: center; justify-content: center;
    padding: var(--s7) clamp(20px, 5vw, 56px) var(--s8); }
  .hero__inner { max-width: 1040px; margin-inline: auto; text-align: center; }
  .hero__eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .18em; text-transform: uppercase;
    color: var(--accent); margin: 0 0 var(--s5); }
  .hero__line { font-family: var(--font-display); font-weight: 500; color: var(--title);
    font-size: clamp(26px, 4.6vw, 48px); line-height: 1.4; letter-spacing: -0.01em; margin: 0; }
  .ln { display: block; white-space: nowrap; }

  /* --- Inline tokens: small; on hover image hides + label expands (line reflows) --- */
  .pill { display: inline-flex; align-items: center; vertical-align: -0.1em; margin: 0 .06em;
    border-radius: 100px; background: transparent; padding: 0; text-decoration: none;
    transition: background .5s var(--ease), padding .62s var(--ease); }
  .pill__img { display: block; width: .78em; height: .78em; overflow: hidden; border-radius: 100px; flex: 0 0 auto;
    border: 1px solid rgba(23, 20, 15, .10); box-shadow: 0 1px 5px rgba(46, 30, 16, .18); background: #ECE3D2;
    transition: width .62s var(--ease), opacity .34s var(--ease); }
  .pill__img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pill__tag { display: inline-flex; align-items: center; max-width: 0; opacity: 0; overflow: hidden; white-space: nowrap;
    transition: max-width .64s var(--ease), opacity .42s var(--ease) .1s; }
  .pill__tag > span { font-family: var(--font-body); font-weight: 600; font-size: .32em; color: var(--title); letter-spacing: .01em; }
  .pill.is-active { background: var(--pill-fill); padding: .14em .5em; }
  .pill.is-active .pill__img { width: 0; opacity: 0; }
  .pill.is-active .pill__tag { max-width: 12em; opacity: 1; }

  /* --- Footer --- */
  .foot { display: flex; flex-wrap: wrap; gap: var(--s2) var(--s5); align-items: baseline;
    padding: var(--s5) clamp(20px, 5vw, 56px) var(--s6); }
  .foot a, .foot span { font-family: var(--font-mono); font-size: 12px; letter-spacing: .06em; color: var(--muted); text-decoration: none; }
  .foot a:hover { color: var(--accent); }

  /* --- Mobile: let it flow naturally (no hover there anyway) --- */
  @media (max-width: 720px) {
    .ln { display: inline; white-space: normal; }
    .hero__line { font-size: clamp(23px, 6.4vw, 32px); }
  }
</style>
</head>
<body>

  <div class="bg" aria-hidden="true">
    <span class="shape s1 fill-t"></span>
    <span class="shape s2 fill-o"></span>
    <span class="shape s3"><svg viewBox="0 0 100 100"><path d="M50,7 C56,33 67,44 93,50 C67,56 56,67 50,93 C44,67 33,56 7,50 C33,44 44,33 50,7 Z" fill="none" stroke="#8F9668" stroke-width="1.5"/></svg></span>
    <span class="shape s4"><svg viewBox="0 0 100 100"><path d="M52,9 C74,7 92,27 90,50 C88,73 66,94 43,89 C22,84 8,64 12,42 C16,22 32,11 52,9 Z" fill="none" stroke="#D3A288" stroke-width="1.5"/></svg></span>
    <span class="shape s5"><svg viewBox="0 0 200 80"><path d="M6,42 C28,14 44,66 66,42 C88,18 104,66 128,42 C152,18 170,60 194,36" fill="none" stroke="#C4B295" stroke-width="1.6" stroke-linecap="round"/></svg></span>
    <span class="shape s6"><svg viewBox="0 0 100 120"><path d="M50,8 C74,34 80,74 50,112 C20,74 26,34 50,8 Z" fill="none" stroke="#9AA07A" stroke-width="1.6"/></svg></span>
    <span class="shape s7"><svg viewBox="0 0 100 100"><path d="M50,10 C66,6 86,20 88,38 C90,58 80,74 62,84 C46,93 22,88 13,70 C6,54 16,32 33,23 C40,19 44,13 50,10 Z" fill="none" stroke="#C98A6C" stroke-width="1.5"/></svg></span>
    <span class="shape s8"><svg viewBox="0 0 100 100"><path d="M50,10 C55,34 66,45 90,50 C66,55 55,66 50,90 C45,66 34,55 10,50 C34,45 45,34 50,10 Z" fill="none" stroke="#A9955F" stroke-width="1.5"/></svg></span>
  </div>

  <header class="top">
    <a class="top__name" href="index.html">Roni Brot-Kolinkó</a>
    <nav class="top__links"><a href="/work">Work</a><a href="/about">About</a></nav>
  </header>

  <main class="hero">
    <div class="hero__inner">
      <p class="hero__eyebrow">Product Designer</p>
      <p class="hero__line"><span class="ln">Hey! I'm <a class="pill" href="/about" aria-label="About"><span class="pill__img"><img style="object-position:center 26%" src="media/home/portrait.png" alt="Illustrated portrait of Roni waving"></span><span class="pill__tag"><span>About</span></span></a> Roni - a product </span><span class="ln">designer <a class="pill" href="/work" aria-label="Work"><span class="pill__img"><img src="media/home/work-token.png" alt="An abstract connected-screens product illustration"></span><span class="pill__tag"><span>Work</span></span></a>, curious person, </span><span class="ln">and someone who cares a lot about </span><span class="ln">how things feel <a class="pill" href="/about#care" aria-label="Off-screen"><span class="pill__img"><img style="object-position:center 30%" src="media/home/lamb.jpg" alt="Roni with a rescued lamb at an animal sanctuary"></span><span class="pill__tag"><span>Off-screen</span></span></a>.</span></p>
    </div>
  </main>

  <footer class="foot">
    <a href="mailto:brotroni@gmail.com">brotroni@gmail.com</a>
    <a href="#">LinkedIn</a>
    <a href="#">Résumé ↓</a>
  </footer>

  <script>
    (function () {
      document.querySelectorAll('.pill').forEach(function (p) {
        var on = function () { p.classList.add('is-active'); };
        var off = function () { p.classList.remove('is-active'); };
        p.addEventListener('mouseenter', on);
        p.addEventListener('mouseleave', off);
        p.addEventListener('focusin', on);
        p.addEventListener('focusout', off);
      });
    })();
  </script>

</body>
</html>
